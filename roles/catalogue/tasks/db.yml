- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes

- name: Add MongoDB GPG key
  ansible.builtin.shell: |
    curl -fsSL https://pgp.mongodb.com/server-8.0.asc | \
    gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
  args:
    creates: /usr/share/keyrings/mongodb-server-8.0.gpg
  changed_when: false

- name: Add MongoDB official repository
  ansible.builtin.apt_repository:
    repo: "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu {{ ansible_distribution_release }}/mongodb-org/8.0 multiverse"
    state: present
    filename: mongodb-org-8.0

- name: Update apt cache after adding MongoDB repo
  ansible.builtin.apt:
    update_cache: yes

- name: Install mongosh
  ansible.builtin.apt:
    name: mongodb-mongosh
    state: present

# 🔥 Check DB existence
- name: Check if catalogue DB exists
  ansible.builtin.command: >
    mongo --host {{ mongo_host }} --quiet --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  register: mongo_check
  changed_when: false
  failed_when: false # Prevents failure if the host is temporarily unreachable

# 🔥 Load schema only once
- name: Load catalogue schema
  ansible.builtin.shell: >
    mongo --host {{ mongo_host }} < /app/db/master-data.js
  when: "mongo_check.stdout | int == -1"