- name: Update apt cache
  apt:
    update_cache: yes

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  timezone:
    name: "{{ timezone }}"

# 🔥 Install NodeJS

- name: Add NodeSource repository
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
  args:
    executable: /bin/bash

- name: Install NodeJS
  apt:
    name: nodejs
    state: present
    update_cache: yes

# 🔥 Create roboshop user (standard practice)
- name: Create roboshop user
  user:
    name: roboshop
    shell: /bin/bash
    create_home: yes

# 🔥 Create app directory
- name: Create app directory
  file:
    path: /app
    state: directory
    owner: roboshop
    group: roboshop

# 🔥 Disable firewall (for lab; in prod use NSG instead)
- name: Disable ufw
  service:
    name: ufw
    state: stopped
    enabled: no
  ignore_errors: yes