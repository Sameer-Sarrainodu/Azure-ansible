
# 🔄 Update apt cache

- name: Update apt cache
  apt:
    update_cache: yes

# 📦 Install common packages

- name: Install common packages
  apt:
    name:
      - curl
      - unzip
      - git
      - nginx
    state: present

# 🌍 Set timezone

- name: Set timezone
  timezone:
    name: Asia/Kolkata

# 🔥 Install NodeJS + npm

- name: Add NodeSource repository
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
  args:
    executable: /bin/bash

- name: Install NodeJS
  apt:
    name: nodejs
    state: present
    update_cache: yes

# ✅ Verify NodeJS installation

- name: Verify NodeJS
  command: node -v
  register: node_version_output
  changed_when: false

- name: Verify npm installation
  command: npm -v
  register: npm_version_output
  changed_when: false

- name: Print NodeJS version
  debug:
    msg: "{{ node_version_output.stdout }}"

- name: Print npm version
  debug:
    msg: "{{ npm_version_output.stdout }}"