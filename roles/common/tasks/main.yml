- name: Update apt cache
  apt:
    update_cache: yes

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  timezone:
    name: "{{ timezone }}"

# 🔥 Install NodeJS

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download NodeSource GPG key
  get_url:
    url: nodesource.com
    dest: /etc/apt/keyrings/nodesource.gpg
    mode: '0644'

- name: Add NodeSource deb repository (Node 18)
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] nodesource.com nodistro main"
    state: present
    filename: nodesource

- name: Install NodeJS
  apt:
    name: nodejs
    state: present
    update_cache: yes

# 🔥 Create roboshop user (standard practice)
- name: Create roboshop user
  user:
    name: roboshop
    shell: /bin/bash
    create_home: yes

# 🔥 Create app directory
- name: Create app directory
  file:
    path: /app
    state: directory
    owner: roboshop
    group: roboshop

# 🔥 Disable firewall (for lab; in prod use NSG instead)
- name: Disable ufw
  service:
    name: ufw
    state: stopped
    enabled: no
  ignore_errors: yes
